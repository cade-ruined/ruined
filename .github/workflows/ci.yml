name: CI

on:
  pull_request:
  push:
    branches: [main, codex/my-ruined-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify native Stripe consent and paid registration offline
        run: node scripts/stripe-sandbox-smoke.mjs --self-test --prepaid --native-consent
      - run: npm run build
